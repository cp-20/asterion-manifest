apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsubame-mcp
  namespace: tsubame-mcp
  labels:
    app: tsubame-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tsubame-mcp
  template:
    metadata:
      labels:
        app: tsubame-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: tsubame-mcp
          image: ghcr.io/cp-20/tsubame-mcp:v0.1.0
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            limits:
              memory: '256Mi'
              cpu: '500m'
            requests:
              memory: '64Mi'
              cpu: '20m'
          env:
            - name: ALLOWED_HOSTS
              value: tsubame-mcp.cp20.dev
            - name: TSUBAME_KEY_FILE
              value: /etc/tsubame/ssh_key
            - name: TSUBAME_KNOWN_HOSTS_FILE
              value: /etc/tsubame/known_hosts
            - name: TSUBAME_USER
              valueFrom:
                secretKeyRef:
                  name: tsubame-mcp-key
                  key: tsubame_user
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tsubame-mcp-key
                  key: mcp_token
          volumeMounts:
            - name: ssh
              mountPath: /etc/tsubame
              readOnly: true
      volumes:
        - name: ssh
          secret:
            secretName: tsubame-mcp-key
            defaultMode: 0440
            items:
              - key: ssh_key
                path: ssh_key
              - key: known_hosts
                path: known_hosts
