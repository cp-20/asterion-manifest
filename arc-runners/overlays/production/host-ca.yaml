# Use the patched public CA store on the production node in the listener pod,
# which talks to the GitHub API. Runner pods are left alone: jobs may install
# packages, and a read-only /etc/ssl/certs would break update-ca-certificates.
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: asterion-kaggle
  namespace: arc-runners
spec:
  listenerTemplate:
    spec:
      containers:
        - name: listener
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          volumeMounts:
            - name: host-ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: host-ca-sources
              mountPath: /usr/share/ca-certificates
              readOnly: true
      volumes:
        - name: host-ca-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory
        - name: host-ca-sources
          hostPath:
            path: /usr/share/ca-certificates
            type: Directory
