apiVersion: batch/v1
kind: Job
metadata:
  name: initialize-database
  namespace: postgresql
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '-2'
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: initialize-database
          image: postgres:16
          env:
            - name: DATABASE_READY_TIMEOUT_SECONDS
              value: '300'
            - name: DATABASE_READY_INTERVAL_SECONDS
              value: '5'
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-password
                  key: root
            - name: APPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-comic-library-database
                  key: password
          command:
            - /bin/sh
            - -ceu
            - |
              waited=0
              while ! pg_isready \
                --host postgresql-headless.postgresql.svc.cluster.local \
                --username postgres \
                --dbname postgres; do
                if [ "$waited" -ge "$DATABASE_READY_TIMEOUT_SECONDS" ]; then
                  echo "timed out waiting ${DATABASE_READY_TIMEOUT_SECONDS}s for PostgreSQL DNS resolution and connections" >&2
                  exit 1
                fi
                sleep "$DATABASE_READY_INTERVAL_SECONDS"
                waited=$((waited + DATABASE_READY_INTERVAL_SECONDS))
              done
              psql \
                --host postgresql-headless.postgresql.svc.cluster.local \
                --username postgres \
                --dbname postgres \
                --set application_password="$APPLICATION_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE web_comic_library LOGIN'
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_roles WHERE rolname = 'web_comic_library'
              )
              \gexec
              ALTER ROLE web_comic_library PASSWORD :'application_password';
              SELECT 'CREATE DATABASE web_comic_library OWNER web_comic_library'
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_database WHERE datname = 'web_comic_library'
              )
              \gexec
              ALTER DATABASE web_comic_library OWNER TO web_comic_library;
              SQL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: web-comic-library
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '-1'
spec:
  backoffLimit: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database
          image: postgres:16
          env:
            - name: DATABASE_READY_TIMEOUT_SECONDS
              value: '300'
            - name: DATABASE_READY_INTERVAL_SECONDS
              value: '5'
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-comic-library-database
                  key: password
          command:
            - /bin/sh
            - -ceu
            - |
              waited=0
              while ! pg_isready \
                --host postgresql-headless.postgresql.svc.cluster.local \
                --username web_comic_library \
                --dbname web_comic_library; do
                if [ "$waited" -ge "$DATABASE_READY_TIMEOUT_SECONDS" ]; then
                  echo "timed out waiting ${DATABASE_READY_TIMEOUT_SECONDS}s for PostgreSQL DNS resolution and connections" >&2
                  exit 1
                fi
                sleep "$DATABASE_READY_INTERVAL_SECONDS"
                waited=$((waited + DATABASE_READY_INTERVAL_SECONDS))
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: migrate
          image: ghcr.io/cp-20/web-comic-library-worker:latest
          command:
            - bun
            - run
            - --cwd
            - packages/db
            - migrate
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-comic-library-database
                  key: password
            - name: DATABASE_URL
              value: postgres://web_comic_library:$(DATABASE_PASSWORD)@postgresql-headless.postgresql.svc.cluster.local:5432/web_comic_library
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 125m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
