apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: web-comic-library
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: web-comic-library
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 3001
      targetPort: http
