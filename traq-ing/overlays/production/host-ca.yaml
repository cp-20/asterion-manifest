# Use the patched public CA store on the production node.
# Bun 1.3.14 does not enforce the explicit CA override; use the fixed TLS implementation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traq-ing-client
  namespace: traq-ing
spec:
  template:
    spec:
      containers:
        - name: traq-ing-client
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          volumeMounts:
            - name: host-ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: host-ca-sources
              mountPath: /usr/share/ca-certificates
              readOnly: true
      volumes:
        - name: host-ca-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory
        - name: host-ca-sources
          hostPath:
            path: /usr/share/ca-certificates
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traq-ing-server
  namespace: traq-ing
spec:
  template:
    spec:
      containers:
        - name: traq-ing-server
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
            - name: BUN_OPTIONS
              value: "--preload /etc/plexus-tls/preload.js"
            - name: PATH
              value: /opt/plexus-bun:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          volumeMounts:
            - name: host-ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: host-ca-sources
              mountPath: /usr/share/ca-certificates
              readOnly: true
            - name: patched-bun
              mountPath: /opt/plexus-bun
              readOnly: true
            - name: bun-ca-preload
              mountPath: /etc/plexus-tls
              readOnly: true
          command:
            - /opt/plexus-bun/bun
            - run
            - start:server
      volumes:
        - name: host-ca-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory
        - name: host-ca-sources
          hostPath:
            path: /usr/share/ca-certificates
            type: Directory
        - name: patched-bun
          emptyDir:
            {}
        - name: bun-ca-preload
          configMap:
            name: bun-ca-preload
      initContainers:
        - name: install-patched-bun
          image: oven/bun:1.4.3@sha256:ec06c3b6cea04192ae6770c434f668ca41d343ad19fa6472216c7b48be39c598
          command:
            - /bin/sh
            - "-c"
            - cp /usr/local/bin/bun /runtime/bun
          volumeMounts:
            - name: patched-bun
              mountPath: /runtime
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: traq-ing-update-messages-job
  namespace: traq-ing
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: traq-ing-update-messages
              env:
                - name: SSL_CERT_FILE
                  value: /etc/ssl/certs/ca-certificates.crt
                - name: SSL_CERT_DIR
                  value: /etc/ssl/certs
                - name: BUN_OPTIONS
                  value: "--preload /etc/plexus-tls/preload.js"
                - name: PATH
                  value: /opt/plexus-bun:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              volumeMounts:
                - name: host-ca-certs
                  mountPath: /etc/ssl/certs
                  readOnly: true
                - name: host-ca-sources
                  mountPath: /usr/share/ca-certificates
                  readOnly: true
                - name: patched-bun
                  mountPath: /opt/plexus-bun
                  readOnly: true
                - name: bun-ca-preload
                  mountPath: /etc/plexus-tls
                  readOnly: true
              command:
                - /opt/plexus-bun/bun
                - run
                - run:update-messages
          initContainers:
            - name: install-patched-bun
              image: oven/bun:1.4.3@sha256:ec06c3b6cea04192ae6770c434f668ca41d343ad19fa6472216c7b48be39c598
              command:
                - /bin/sh
                - "-c"
                - cp /usr/local/bin/bun /runtime/bun
              volumeMounts:
                - name: patched-bun
                  mountPath: /runtime
            - name: check-update-all-messages-job
              env:
                - name: SSL_CERT_FILE
                  value: /etc/ssl/certs/ca-certificates.crt
                - name: SSL_CERT_DIR
                  value: /etc/ssl/certs
              volumeMounts:
                - name: host-ca-certs
                  mountPath: /etc/ssl/certs
                  readOnly: true
                - name: host-ca-sources
                  mountPath: /usr/share/ca-certificates
                  readOnly: true
          volumes:
            - name: host-ca-certs
              hostPath:
                path: /etc/ssl/certs
                type: Directory
            - name: host-ca-sources
              hostPath:
                path: /usr/share/ca-certificates
                type: Directory
            - name: patched-bun
              emptyDir:
                {}
            - name: bun-ca-preload
              configMap:
                name: bun-ca-preload
---
