# Use the patched public CA store on the production node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
spec:
  template:
    spec:
      containers:
        - name: adminer
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          volumeMounts:
            - name: host-ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: host-ca-sources
              mountPath: /usr/share/ca-certificates
              readOnly: true
      volumes:
        - name: host-ca-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory
        - name: host-ca-sources
          hostPath:
            path: /usr/share/ca-certificates
            type: Directory
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: postgresql
spec:
  template:
    spec:
      containers:
        - name: postgresql
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          volumeMounts:
            - name: host-ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: host-ca-sources
              mountPath: /usr/share/ca-certificates
              readOnly: true
      volumes:
        - name: host-ca-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory
        - name: host-ca-sources
          hostPath:
            path: /usr/share/ca-certificates
            type: Directory
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: web-comic-library-base-backup
  namespace: postgresql
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              env:
                - name: SSL_CERT_FILE
                  value: /etc/ssl/certs/ca-certificates.crt
                - name: SSL_CERT_DIR
                  value: /etc/ssl/certs
              volumeMounts:
                - name: host-ca-certs
                  mountPath: /etc/ssl/certs
                  readOnly: true
                - name: host-ca-sources
                  mountPath: /usr/share/ca-certificates
                  readOnly: true
          volumes:
            - name: host-ca-certs
              hostPath:
                path: /etc/ssl/certs
                type: Directory
            - name: host-ca-sources
              hostPath:
                path: /usr/share/ca-certificates
                type: Directory
