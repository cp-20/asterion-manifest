apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Actions Runner Controller (gha-runner-scale-set mode).
# Runner scale sets live in ../../arc-runners and must use the same chart version.
helmCharts:
  - name: gha-runner-scale-set-controller
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    version: 0.15.1
    releaseName: arc
    namespace: arc-systems
    includeCRDs: true
    valuesInline:
      # Service account name is referenced by arc-runners (controllerServiceAccount.name).
      fullnameOverride: arc-gha-rs-controller
      flags:
        logLevel: info
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

patches:
  # The ARC CRDs are over 1 MB, which exceeds the last-applied-configuration
  # annotation limit of client-side apply.
  - target:
      kind: CustomResourceDefinition
      group: apiextensions.k8s.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: unused
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
